# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: rename .example.env to .env
      run: mv .example.env .env

    - name: change db_name to postgres
      run: sed -i 's/ ${DB_HOST} /postgres/' src/main/resources/application.properties

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Extract with Maven
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

    - name: Build docker image
      run: docker build -t draifis/loc-mns-back .

    - name: Tag image with version from pom.xml
      run: docker tag draifis/loc-mns-back draifis/loc-mns-back:${{env.VERSION}}

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: draifis
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push docker image
      run: docker push draifis/loc-mns-back

    - name: Push docker image with version
      run: docker push draifis/loc-mns-back:${{env.VERSION}}

    - name: Deploy container (local self-hosted server)
      run: |
        docker pull draifis/loc-mns-back:latest
        
        docker stop loc-back || true
        docker rm loc-back || true
        
        docker run -d \
          --name loc-back \
          -p 8080:8080 \
          --env-file /home/deploy/.env \
          draifis/loc-mns-back:latest
      

