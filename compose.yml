services:
  postgres:
    image: postgres:18
    container_name: postgres_container_locmns
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: locmns_db
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
      image: draifis/loc-mns-back:0.0.1-SNAPSHOT
      ports:
        - "8080:8080"
      depends_on:
        - postgres

volumes:
  postgres_data: